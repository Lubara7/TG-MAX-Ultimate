name: Install prototype APK
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Build MaxGram APK run containing the prototype
        required: true
        type: string
  workflow_run:
    workflows: ["Build MaxGram APK"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  phone-screen:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Resolve the prototype build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id || inputs.build_run_id }}
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          SOURCE_REVISION=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" --jq .head_sha)
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          echo "run_id=$BUILD_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_REVISION" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.build.outputs.source_sha }}
      - name: Download and verify the prototype APK
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ steps.build.outputs.run_id }}
        run: |
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" -n maxgram-apk
          awk '$2 ~ /\.apk$/ {print}' SHA256SUMS.txt | sha256sum --check --strict
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/tgmax-signing/debug.keystore
          key: tgmax-alpha-debug-keystore-v2
      - name: Verify the saved alpha signing certificate
        run: |
          keytool -exportcert -keystore /tmp/tgmax-signing/debug.keystore -alias androiddebugkey -storepass android -file alpha-certificate.der
          python3 - <<'PYCODE'
          import hashlib, pathlib, re
          certificate = pathlib.Path('alpha-certificate.der').read_bytes()
          report = pathlib.Path('signature-verification.txt').read_text()
          expected = re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+)', report)[1].lower()
          assert hashlib.sha256(certificate).hexdigest() == expected
          print('Prototype APK matches the saved alpha signing key')
          PYCODE
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0 platforms;android-36'
          log-accepted-android-sdk-licenses: false
      - name: Prepare Android protocol fixture check
        run: |
          mkdir -p codec-classes codec-dex
          javac -source 8 -target 8 -cp "$ANDROID_HOME/platforms/android-36/android.jar" -d codec-classes scripts/CodecDeviceSmoke.java scripts/CodecInstrumentation.java
          "$ANDROID_HOME/build-tools/36.0.0/d8" --min-api 27 --lib "$ANDROID_HOME/platforms/android-36/android.jar" --output codec-dex codec-classes/io/github/lubara7/tgmax/codectest/*.class
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" link --manifest scripts/codec-test-AndroidManifest.xml -I "$ANDROID_HOME/platforms/android-36/android.jar" -o codec-test-unsigned.apk
          python3 - <<'PYCODE'
          import zipfile
          with zipfile.ZipFile('codec-test-unsigned.apk', 'a') as apk:
              apk.write('codec-dex/classes.dex', 'classes.dex')
          PYCODE
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f 4 codec-test-unsigned.apk codec-test-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks /tmp/tgmax-signing/debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out codec-test.apk codec-test-aligned.apk
      - name: Allow emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare phone-screen check
        run: |
          cat > smoke-phone.sh <<'SCRIPT'
          set -euo pipefail
          pkg=io.github.lubara7.tgmax
          adb shell getprop ro.product.cpu.abilist | grep -F arm64-v8a
          adb install -g MAXGRAM-CLIENT-*.apk
          adb install -t -g codec-test.apk
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          activity=$(adb shell cmd package resolve-activity --brief "$pkg" | tail -n1 | tr -d '\r')
          adb shell am start -W -n "$activity"
          python3 scripts/check_phone_ui.py
          adb shell am instrument -w io.github.lubara7.tgmax.codectest/io.github.lubara7.tgmax.codectest.CodecInstrumentation | tee codec-smoke.txt || true
          adb logcat -d > codec-logcat.txt
          grep -F 'INSTRUMENTATION_RESULT: codec_check=passed' codec-smoke.txt
          grep -F 'INSTRUMENTATION_RESULT: features_check=passed' codec-smoke.txt
          SCRIPT
      - name: Install and open phone login
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          script: bash "$GITHUB_WORKSPACE/smoke-phone.sh"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: phone-login-ui
          path: |
            codec-smoke.txt
            codec-logcat.txt
            login.xml
            login*.xml
            login*.png
            languages.png
            languages.xml
            localized-login.xml
            login-country.xml
            countries.xml
            countries.png
            startup-logcat.txt
            activity-state.txt
            failure.png
            anr-traces/
