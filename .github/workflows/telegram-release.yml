name: Build MaxGram APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk]') || contains(github.event.head_commit.message, '[release]')
    concurrency:
      group: telegram-release
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      NATIVE_TARGET: arm64-v8a
      GRADLE_OPTS: -Dorg.gradle.workers.max=2
      TGMAX_ALPHA_KEYSTORE: /tmp/tgmax-signing/debug.keystore
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache/restore@v4
        id: alpha-key
        with:
          path: ${{ env.TGMAX_ALPHA_KEYSTORE }}
          key: tgmax-alpha-debug-keystore-v2
      - name: Prepare alpha signing key
        run: |
          mkdir -p "$(dirname "$TGMAX_ALPHA_KEYSTORE")"
          if [ ! -s "$TGMAX_ALPHA_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$TGMAX_ALPHA_KEYSTORE" -storetype PKCS12 -alias androiddebugkey -storepass android -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
      - uses: actions/cache/save@v4
        if: steps.alpha-key.outputs.cache-hit != 'true'
        with:
          path: ${{ env.TGMAX_ALPHA_KEYSTORE }}
          key: tgmax-alpha-debug-keystore-v2
      - name: Install native Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.31.6'
      - name: Prepare pinned Telegram source
        run: |
          git submodule update --init --depth 1 upstream/telegram upstream/komet
          python3 scripts/prepare_telegram_client.py
          python3 scripts/init_telegram_dependencies.py
      - name: Test MAX backend and compile Telegram Java
        working-directory: build/telegram-client
        run: ./gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g' :tgmax-backend:test :TMessagesProj:compileDebugJavaWithJavac
      - name: Build real Telegram ARM64 APK
        working-directory: build/telegram-client
        run: ./gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g' :TMessagesProj_AppStandalone:assembleAfatDebug
      - name: Prepare and verify release artifacts
        run: |
          mkdir -p dist
          python3 scripts/package_release.py --client build/telegram-client --output dist
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/*.apk > dist/signature-verification.txt
          cp docs/release-notes.md dist/release-notes.md
      - uses: actions/upload-artifact@v6
        with:
          name: maxgram-apk
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/signature-verification.txt
            dist/build-provenance.json
            dist/apk-manifest.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: maxgram-source
          path: |
            dist/*-source.tar.gz
            dist/release-notes.md
          if-no-files-found: error
      - name: Record prototype status
        run: echo 'Prototype APK built. Publication requires the separate verified-release workflow and matching 72-hour acceptance evidence.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: telegram-build-reports
          path: |
            build/telegram-client/**/build/reports/
            build/telegram-client/TGMAX_CHANGES.*
