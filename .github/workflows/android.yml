name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - name: Unit tests, lint, both backends and device-test compilation
        run: >-
          ./gradlew --no-daemon
          :max-backend:test :max-backend:writeAdapterClasspath
          :core:domain:test
          :core:data:testDemoDebugUnitTest
          :core:data:testProductionDebugUnitTest
          :core:localization:testDebugUnitTest
          :feature:auth:testDebugUnitTest
          :auth-harness:lintDemoDebug :auth-harness:lintProductionDebug
          :auth-harness:assembleDemoDebug :auth-harness:assembleProductionDebug
          :core:data:assembleDemoDebugAndroidTest
      - name: Verify release acceptance gate
        run: python3 -m unittest discover -s scripts -p 'test_release_validation.py'
      - name: Check pinned Telegram integration
        run: |
          git submodule update --init --depth 1 upstream/telegram
          python3 scripts/check_telegram_api.py
          python3 scripts/prepare_telegram_client.py
          python3 scripts/check_login_preparation.py
          node scripts/test_captcha_bridge.mjs
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verification-reports
          path: |
            **/build/reports/tests/
            tools-auth-harness/build/reports/lint-results-*.html
